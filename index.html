<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>footer</title>
    <!-- fav_icon  -->
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <!-- font awesome -->
    <script
      src="https://kit.fontawesome.com/2191fb3337.js"
      crossorigin="anonymous"
    ></script>

    <!-- css -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- footer -->
    <footer class="footer">
      <div class="main-part">
        <!-- 1 item in flexbox -->
        <div class="footer-list-wraper">
          <h3 class="footer-heading">Grand Hotel</h3>
          <ul class="footer-list">
            <li class="footer-list-item">
              <a href="#" class="footer-list-link">support@grandhotel.com</a>
            </li>

            <li class="footer-list-item">
              <a href="#" class="footer-list-link">New York, Main Street 123</a>
            </li>

            <li class="footer-list-item">
              <a href="#" class="footer-list-link">Tel: +123 456 789</a>
            </li>
          </ul>
        </div>
        <!-- end of 1 item in flexbox -->

        <!-- 2 item in flexbox -->
        <div class="footer-list-wraper">
          <h3 class="footer-heading">Explore</h3>
          <ul class="footer-list">
            <li class="footer-list-item">
              <a href="#" class="footer-list-link">Home</a>
            </li>

            <li class="footer-list-item">
              <a href="#" class="footer-list-link">About Us</a>
            </li>

            <li class="footer-list-item">
              <a href="#" class="footer-list-link">Rooms</a>
            </li>

            <li class="footer-list-item">
              <a href="#" class="footer-list-link">Events</a>
            </li>

            <li class="footer-list-item">
              <a href="#" class="footer-list-link">Customers</a>
            </li>
            <li class="footer-list-item">
              <a href="#" class="footer-list-link">Contact</a>
            </li>
          </ul>
        </div>
        <!-- end of 2 items in flexbox -->

        <!-- 3 item in flexbox -->
        <div class="contact">
          <h3 class="footer-heading">Contact</h3>
          <p>Sign Uo for News</p>
          <form class="footer-form">
            <input
              type="text"
              name=""
              id=""
              class="footer-input"
              placeholder="Your email..."
            />
            <button class="footer-btn">Sign Up</button>
          </form>
        </div>
        <!-- end of 3 items in flexbox -->

        <!-- 4 items in flexbox -->

        <div class="gallery">
          <h3 class="footer-heading">Gallery</h3>
          <div class="gallery-images">
            <div class="image-wrapper">
              <img
                src="images/image1.jpg"
                alt="footer-image"
                class="footer-image"
              />
            </div>

            <div class="image-wrapper">
              <img
                src="images/image2.jpg"
                alt="footer-image"
                class="footer-image"
              />
            </div>

            <div class="image-wrapper">
              <img
                src="images/image3.jpg"
                alt="footer-image"
                class="footer-image"
              />
            </div>

            <div class="image-wrapper">
              <img
                src="images/image4.jpg"
                alt="footer-image"
                class="footer-image"
              />
            </div>

            <div class="image-wrapper">
              <img
                src="images/image5.jpg"
                alt="footer-image"
                class="footer-image"
              />
            </div>

            <div class="image-wrapper">
              <img
                src="images/image6.jpg"
                alt="footer-image"
                class="footer-image"
              />
            </div>
          </div>
          <!-- end of gallery image -->
        </div>
        <!-- end of gallery -->
      </div>
      <!-- end of main-part -->

      <div class="creator-part">
        <div class="copyright-text">
          <p>Copyright &copy; 2024. Grand Hotel.All Rights Reserved</p>
        </div>

        <div class="text-right">
          <p>
            Made With <i class="fas fa-heart"></i> by <span>CodeAndCreate</span>
          </p>
        </div>
      </div>
    </footer>
    <!-- end of footer -->
  </body>
</html>
